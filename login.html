<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="login_page_title">تسجيل الدخول - أشياء للإيجار</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header id="header-placeholder">
        <!-- Header content will be loaded by JS -->
    </header>

    <main class="auth-page">
        <h1 data-translate="login_heading">تسجيل الدخول</h1>
        <form id="login-form">
            <div id="auth-feedback" class="feedback-message" style="color: red; margin-bottom: 10px; display: none;"></div> <!-- Add this -->
            <div class="form-group">
                <label for="email" data-translate="email_label">البريد الإلكتروني</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password" data-translate="password_label">كلمة المرور</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" data-translate="login_button">تسجيل الدخول</button>
            <p class="auth-switch" data-translate="no_account">ليس لديك حساب؟ <a href="register.html" data-translate="register_link">إنشاء حساب جديد</a></p>
        </form>
    </main>

    <footer id="footer-placeholder">
        <!-- Footer content will be loaded by JS -->
    </footer>

    <!-- Project Scripts -->
    <script type="module" src="js/firebase-config.js"></script>
    <script src="js/language-switcher.js"></script>
    <script src="js/components.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
